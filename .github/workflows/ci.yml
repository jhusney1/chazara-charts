name: CI
on:
  pull_request:
  push:
    branches: [master]

# One release at a time; a newer push to master waits for the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client

  # Build the production image on GitHub's runners and push it to the GitHub
  # container registry, tagged with the short SHA and latest. The Droplet
  # never builds; it only pulls.
  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "sha=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:latest
          build-args: GIT_SHA=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pull that image on the Droplet and restart. Seconds, not minutes.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      - name: Deploy ${{ needs.build.outputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" "${{ needs.build.outputs.sha }}" pull < scripts/deploy-remote.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      - name: Smoke-check production
        run: bash scripts/smoke.sh "${{ vars.PROD_URL }}" "${{ needs.build.outputs.sha }}"
