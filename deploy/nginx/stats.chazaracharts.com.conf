# Umami analytics dashboard at stats.chazaracharts.com.
#
# nginx on the Droplet is configured by hand (it is not deployed from this
# repo), so this file is the reference copy. Install it with the steps in
# README "Analytics"; `certbot --nginx -d stats.chazaracharts.com` then adds
# the HTTPS listener and redirect to this block.
#
# Umami listens on 127.0.0.1:3010 (UMAMI_PORT in docker-compose.yml), so it is
# reachable only through this block, never directly from the internet.

server {
    listen 80;
    listen [::]:80;
    server_name stats.chazaracharts.com;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
