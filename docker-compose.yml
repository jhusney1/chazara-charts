services:
  # Production service: Express server serving React build
  app:
    # Built and pushed by .github/workflows/ci.yml on every push to master;
    # the Droplet only pulls. APP_IMAGE_TAG is written to .env by
    # scripts/deploy-remote.sh. `docker compose up --build app` still works
    # for a local build and tags the result with this name.
    image: ghcr.io/jhusney1/chazara-charts:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      # Host port is configurable so this can coexist with anything else
      # already bound to 3000 on the host. Container port stays 3000.
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    volumes:
      # For production, you might want to exclude volumes to use the built image as is
      []
    networks:
      - chazara-network
    profiles: ["prod", "default"]

  # Development API server
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"  # Maps host port 3001 to container port 3001
    environment:
      - NODE_ENV=development
      - PORT=3001
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    entrypoint: >
      sh -c "npm install && npm run dev"
    networks:
      - chazara-network
    profiles: ["dev"]

  # React development server
  react-dev:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "3002:3000"  # Maps host port 3002 to container port 3000
    environment:
      - NODE_ENV=development
      # Read by setupProxy.js inside the dev server (not the browser), so a
      # compose service name is correct here. Browser code uses relative /api.
      - API_PROXY_TARGET=http://api-dev:3001
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    command: npm start
    depends_on:
      - api-dev
    networks:
      - chazara-network
    profiles: ["dev"]

networks:
  chazara-network:
    driver: bridge